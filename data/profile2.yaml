name: "Dr. Celadon"
title: "Digital Heritage Researcher<br>Human-Centered AI Designer"
summary: >
  I study how ==cultural memory== can be preserved, interpreted, and shared with
  responsible computational tools. My work combines ~~machine learning~~,
  participatory design, and archival practice to help museums transform fragile
  collections into searchable, teachable, and ethically documented knowledge.

  Across projects, I build systems that support curators rather than replace
  them: image models for ceramic fragments, interfaces for uncertain annotations,
  and public-facing datasets that make provenance, context, and community voice
  visible.
affiliation: "Associate Research Fellow at the Institute of Digital Heritage<br>Celadon Lab for Historical Data"
