[sitemap]
changefreq = "monthly"
priority = 0.5
filename = "sitemap.xml"

[params]
text_color = "black" #"white"
author = ""
favicon = "images/rukav_logo_square-transparent.png"
# site_logo is black text: right for a light background (browser tab chrome,
# and the light theme's white header), wrong for the default dark theme's navy
# header, where it is nearly invisible. site_logo_dark is the white variant
# used there instead; see the swap in site-navigation.html.
site_logo = "images/rukav_logo_square-transparent.png"
site_logo_dark = "images/rukav_logo_square-transparent-white.png"
# Link-preview image for pages that have no featured_image of their own
# (home, donate, contact, ...). Resolved from assets/ by func/GetSocialImage.html.
social_image = "images/2025-07-19_Foundation-group-with-smiles.png"

# Images published byte-for-byte, with no resizing or re-encoding. The render
# hook still emits width/height for them, so they do not cause layout shift.
# Use this for anything where recompression artifacts would matter: the bank QR
# code has to stay scannable, and Hugo cannot emit truly lossless WebP.
verbatim_images = ["images/rukav_bank-qr-code.png"]
description = "RuKAV — the Russian-speaking Cultural and Academic Association in Zurich, Switzerland. Events, community, and support for Russian-speaking students and academics."
# choose a background color from any on this page: https://tachyons.io/docs/themes/skins/ and preface it with "bg-"
background_color_class = "bg-dark-blue"
recent_posts_number = 3

[params.ananke]
custom_css = ["css/custom.css"]

# Social links in the header, rendered as SVG icons by the theme's
# social/follow.html partial. The URLs are built from the profile templates in
# the theme's own params.toml, so only the usernames belong here.
[params.ananke.social.follow]
  networks = ["instagram", "youtube"]

[params.ananke.social.instagram]
  username = "rukav.swiss"

[params.ananke.social.youtube]
  username = "Rukav-Swiss"

# Read by layouts/events/list.html.
#   showUpcoming - render the "Upcoming events" group at all
#   maxDisplay   - cap on how many upcoming events are listed
#   dateFormat   - Go date layout used on the events page
[params.events]
  showUpcoming = true
  maxDisplay = 5
  dateFormat = "2 January, 2006"