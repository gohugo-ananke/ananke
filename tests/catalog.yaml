# Feature -> test catalog (coverage gate).
#
# Every [ananke] parameter and every shortcode in layouts/_shortcodes must be
# listed here with at least one test reference, or `npm run test:coverage-gate`
# fails. This forces a test to accompany each new or changed feature.
#
# `tests` entries must name existing executable spec or quickstart files.
# This checks registration and paths, not whether assertions cover every behaviour.

params:
  ananke.responsive_image_widths:
    tests: ["tests/e2e/responsive-header.spec.ts"]
  ananke.show_recent_posts:
    tests: ["scripts/test-hugo-quickstart.ts"]
  ananke.show_categories:
    tests: ["scripts/test-hugo-quickstart.ts"]
  ananke.copy_code:
    tests:
      - "tests/e2e/copy-button.spec.ts"
      - "tests/fixtures/copy-code/copy-code.test.mjs"
  ananke.navigation.submenu_mode:
    tests: ["tests/e2e/navigation-modes.spec.ts"]
  ananke.navigation.classes.nav:
    tests: ["tests/e2e/navigation.spec.ts"]
  ananke.navigation.classes.inner:
    tests: ["tests/e2e/navigation.spec.ts"]
  ananke.navigation.classes.brand:
    tests: ["tests/e2e/navigation.spec.ts"]
  ananke.navigation.classes.toggle:
    tests: ["tests/e2e/navigation.spec.ts"]
  ananke.navigation.classes.group:
    tests: ["tests/e2e/header.spec.ts"]
  ananke.navigation.classes.panel:
    tests: ["tests/e2e/navigation.spec.ts"]
  ananke.navigation.classes.menu:
    tests: ["tests/e2e/navigation.spec.ts"]
  ananke.navigation.classes.item:
    tests: ["tests/e2e/navigation.spec.ts"]
  ananke.navigation.classes.link:
    tests: ["tests/e2e/navigation.spec.ts"]
  ananke.navigation.classes.submenu_toggle:
    tests: ["tests/e2e/navigation.spec.ts"]
  ananke.navigation.classes.submenu:
    tests: ["tests/e2e/navigation.spec.ts"]
  ananke.navigation.classes.submenu_link:
    tests: ["tests/e2e/navigation.spec.ts"]

shortcodes:
  edit-page:
    tests: ["tests/e2e/shortcodes.spec.ts"]
  form-contact:
    tests: ["tests/e2e/shortcodes.spec.ts"]
  page-index:
    tests: ["tests/e2e/shortcodes.spec.ts"]
  since:
    tests: ["tests/e2e/shortcodes.spec.ts"]
