baseURL = "http://localhost:4321/"
title = "Ananke Test Fixture"
theme = "ananke"
enableRobotsTXT = true

[taxonomies]
category = "categories"
tag = "tags"

[params]
mainSections = ["posts"]

[params.ananke]
show_recent_posts = true
show_categories = true
copy_code = true

# Header layout with a custom `search` component in its own group
# (tests/e2e/header.spec.ts, tests/e2e/navigation.spec.ts). The component is
# tests/fixtures/site/layouts/_partials/hooks/header/search.html.
[params.ananke.header]
navigation = [["logo"], ["search"], ["languages", "menu", "social"]]

# Explicit site value; navigation-modes fixtures override it via cascade and front matter.
[params.ananke.navigation]
submenu_mode = "split"

# Replace the default classes of one navigation element (tests/e2e/navigation.spec.ts).
[params.ananke.navigation.classes]
link = "hover-white white-90 no-underline fixture-site-link"
toggle = "f5 white-90 hover-white fixture-menu-button"

# Main menu with submenus (tests/e2e/navigation.spec.ts):
#   Posts  - parent with its own page; children from config and front matter
#   Topics - parent without a URL; Tags has a third-level child
#   About  - flat entry
[[menus.main]]
name = "Posts"
pageRef = "/posts/"
identifier = "posts"
weight = 10

[[menus.main]]
name = "Second Post"
pageRef = "/posts/second/"
parent = "posts"
weight = 20

[[menus.main]]
name = "Topics"
identifier = "topics"
weight = 15

[[menus.main]]
name = "Categories"
pageRef = "/categories/"
parent = "topics"
weight = 10

[[menus.main]]
name = "Tags"
pageRef = "/tags/"
identifier = "tags"
parent = "topics"
weight = 20

[[menus.main]]
name = "Alpha"
pageRef = "/tags/alpha/"
parent = "tags"
weight = 10

[[menus.main]]
name = "About"
pageRef = "/about/"
weight = 20
